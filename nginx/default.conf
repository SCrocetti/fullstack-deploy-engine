# Definimos el grupo de servidores de backend
upstream backend_servers {
    server project-back:8080;
}

server {
    listen 80;
    server_name localhost;

    # --- CENTRALIZED SECURITY HEADERS ---
    # Outdated X-XSS-Protection removed. Completely managed by CSP now.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Tightened CSP: Multi-line formatting for easy maintenance
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self';
        style-src   'self' 'unsafe-inline';
        img-src     'self' data:;
        font-src    'self';
        frame-src   'none';
        object-src  'none';
        base-uri    'self';
        form-action 'self';
    " always;

    # FRONTEND
    location / {
        proxy_pass http://project-front:80;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BACKEND API
    location /api/ {
        proxy_pass http://backend_servers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
